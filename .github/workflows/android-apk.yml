name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend URL baked into the app'
        required: false
        default: 'https://msr.72-60-110-25.sslip.io'
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: flutter build apk --release --dart-define=API_URL=${{ github.event.inputs.api_url || 'https://msr.72-60-110-25.sslip.io' }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/MSR-Rishtey.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MSR-Rishtey-apk
          path: app/build/MSR-Rishtey.apk
      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: MSR Rishtey App v1.0.${{ github.run_number }}
          body: |
            Meena Shadi Rishtey – Android APK
            API: ${{ github.event.inputs.api_url || 'https://msr.72-60-110-25.sslip.io' }}
            Download **MSR-Rishtey.apk** below and install (allow "Install unknown apps").
          files: app/build/MSR-Rishtey.apk
          make_latest: true
